---
# Thin entry point. Each tier lives in tasks/<tier>.yml and carries a tag, so
# `ansible-playbook site.yml --tags backup` touches only that tier.
- name: Deploy the knowledge platform
  hosts: all
  become: true

  pre_tasks:
    - name: Validate configuration
      ansible.builtin.import_tasks: tasks/validate.yml
      tags: [always]

  tasks:
    - name: Docker prerequisites
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker, outline, edge, private_path]

    - name: Outline stack (app + data tier)
      ansible.builtin.import_tasks: tasks/outline.yml
      tags: [outline]

    - name: Edge stack (cloudflared, Caddy, dnsmasq)
      ansible.builtin.import_tasks: tasks/edge.yml
      tags: [edge, private_path]

    - name: Host firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      tags: [firewall]

    - name: Backups
      ansible.builtin.import_tasks: tasks/backup.yml
      tags: [backup]

    - name: Start stacks
      ansible.builtin.import_tasks: tasks/start.yml
      tags: [outline, edge, private_path]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
