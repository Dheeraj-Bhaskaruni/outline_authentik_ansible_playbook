name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install --quiet ansible-core pyyaml
      - name: Syntax check
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook restore.yml --syntax-check
      - name: Security configuration tests
        run: python tests/validate_security.py
      - name: Webhook consumer tests
        run: python tests/test_webhook_consumer.py
      - name: Refuse unencrypted secrets
        run: |
          if [ -f secrets.yml ] && ! head -1 secrets.yml | grep -q '^\$ANSIBLE_VAULT'; then
            echo "secrets.yml is not vault-encrypted"; exit 1; fi
