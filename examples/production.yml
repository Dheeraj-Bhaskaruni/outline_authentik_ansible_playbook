---
# Copy to production.yml (gitignored), then replace every example value.
# Cloudflare Zero Trust objects (tunnel, Access applications, DNS CNAMEs) are
# created once by hand or CLI; docs/cloudflare-security.md has the exact steps.
production_mode: true
outline_url: https://notes.example.com
outline_app_name: My Notes

# Recommended: sign in with Google (or any IdP) through Cloudflare Access.
# No Authentik, no private TLS proxy, one login, App Launcher as the dashboard.
auth_mode: cloudflare
# Zero Trust > Access controls > Applications > (SaaS app, OIDC) > Client ID
cloudflare_access_oidc_client_id: CHANGE_ME_CLIENT_ID

# Set real immutable digests for compatible, tested releases.
# Existing data must follow the vendor's upgrade path.
outline_image: docker.getoutline.com/outlinewiki/outline@sha256:CHANGE_ME
postgres_image: postgres@sha256:CHANGE_ME
redis_image: redis@sha256:CHANGE_ME
cloudflared_image: cloudflare/cloudflared@sha256:CHANGE_ME

mailhog_enabled: false
outline_smtp_host: mail.example.com
outline_smtp_port: 465
outline_smtp_secure: true
outline_smtp_from_email: notes@example.com
outline_smtp_username: notes@example.com
# Store outline_smtp_password in encrypted secrets.yml.

# --- Cloudflare edge -------------------------------------------------------
cloudflare_tunnel_enabled: true
# Zero Trust > Settings > Custom Pages shows the team domain <team>.cloudflareaccess.com
cloudflare_access_team_name: example-team
# Zero Trust > Access controls > Applications > (self-hosted app) > Overview > Application Audience (AUD) Tag
cloudflare_access_outline_aud: CHANGE_ME_64_HEX
# cloudflare_tunnel_credentials and cloudflare_access_oidc_client_secret live in secrets.yml.

# --- Host firewall ---------------------------------------------------------
# Enable once you have confirmed how you reach SSH. Example: Tailscale only.
firewall_enabled: true
firewall_ssh_port: 22
firewall_ssh_source: 100.64.0.0/10

# --- Alternative: self-hosted Authentik as the identity provider -------------
# auth_mode: authentik
# authentik_external_url: https://auth.example.com
# authentik_image: ghcr.io/goauthentik/server@sha256:CHANGE_ME
# caddy_image: caddy@sha256:CHANGE_ME
# caddy_builder_image: caddy@sha256:CHANGE_ME     # the matching "-builder" tag's digest
# acme_email: you@example.com
# cloudflare_access_authentik_aud: CHANGE_ME_64_HEX
# plus authentik_*, outline_oidc_client_* and cloudflare_dns_api_token in secrets.yml
