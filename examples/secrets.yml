---
# Copy to secrets.yml (gitignored), populate locally, then ansible-vault encrypt.
# Generate hex values with: openssl rand -hex 32
# Never replace an existing database password or signing key without a migration.
outline_secret_key: CHANGE_ME
outline_utils_secret: CHANGE_ME
outline_db_password: CHANGE_ME
outline_smtp_password: CHANGE_ME

# Login: client secret of the Cloudflare Access for SaaS (OIDC) application.
cloudflare_access_oidc_client_secret: CHANGE_ME

# Public edge: paste the whole file written by `cloudflared tunnel create`.
cloudflare_tunnel_credentials: |
  {"AccountTag":"CHANGE_ME","TunnelSecret":"CHANGE_ME","TunnelID":"CHANGE_ME"}

# Private path: API token scoped to ONE zone with Zone.Zone:Read + Zone.DNS:Edit.
# Used by Caddy for DNS-01 certificate issuance only.
cloudflare_dns_api_token: CHANGE_ME

# Backups
backup_restic_password: CHANGE_ME      # openssl rand -hex 32; keep a copy in your password manager
backup_r2_access_key: CHANGE_ME
backup_r2_secret_key: CHANGE_ME
# backup_b2_account_id: CHANGE_ME
# backup_b2_account_key: CHANGE_ME

# Automation (only if automation_enabled)
# outline_webhook_secret: CHANGE_ME     # Outline > Settings > Webhooks > signing secret
