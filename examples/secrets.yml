---
# Copy to secrets.yml (gitignored), populate locally, then ansible-vault encrypt.
# Generate each hex value separately with: openssl rand -hex 32
# Never replace an existing database password or signing key without a migration.
outline_secret_key: CHANGE_ME
outline_utils_secret: CHANGE_ME
outline_db_password: CHANGE_ME
outline_smtp_password: CHANGE_ME

# Cloudflare edge (cloudflare_tunnel_enabled: true)
# Paste the whole file written by `cloudflared tunnel create` (~/.cloudflared/<UUID>.json).
cloudflare_tunnel_credentials: |
  {"AccountTag":"CHANGE_ME","TunnelSecret":"CHANGE_ME","TunnelID":"CHANGE_ME"}

# auth_mode: cloudflare - client secret of the Access for SaaS (OIDC) application.
cloudflare_access_oidc_client_secret: CHANGE_ME

# auth_mode: authentik only
# authentik_secret_key: CHANGE_ME
# authentik_db_password: CHANGE_ME
# outline_oidc_client_id: CHANGE_ME
# outline_oidc_client_secret: CHANGE_ME
# API token scoped to ONE zone with Zone.Zone:Read + Zone.DNS:Edit, used by Caddy
# for DNS-01 certificate issuance only.
# cloudflare_dns_api_token: CHANGE_ME
